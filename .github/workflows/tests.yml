name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # neural-amp-modeler is an inference-only dev dep: its full tree (librosa->numba,
          # pytorch-lightning) will not install on 3.13 and is training-only. tests/conftest.py
          # fabricates those, so --no-deps + real pydantic is enough for the round-trip test.
          pip install neural-amp-modeler --no-deps pydantic
      - name: Run tests
        run: pytest tests/ -q
