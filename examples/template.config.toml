# Template for a new device's config.toml. Copy this, fill in the fields, and see
# "Per-circuit configs" in the README for the full field-to-CLI mapping -- or let
# scaffold_config.py write one for you from the .schx, which is what
# docs/new-circuit-walkthrough.md step 1 does and is easier than filling this in by hand.
#
#   python run_pipeline.py --config path/to/your-device/config.toml \
#       --dataset-dir /tmp/ds --nam-output /tmp/model.param.nam \
#       --checkpoint-dir /tmp/ckpt

schx       = "path/to/your-circuit.schx"   # e.g. from LiveSPICE-Amp-Collection, or your own

input      = "examples/T3K-sweep-v3.wav"   # NOT bundled -- download it first, see README
                                       # sweep/DI. A good one covers the top of the band
                                       # (real playing alone rarely does) and includes real
                                       # transient attacks, not just steady tones.
backend    = "livespice"

# MEASURED, not guessed -- see measure_truncation.py (README: Scripts). The argparse
# default (2) is too low for most real circuits; this is a reasonable starting point.
oversample = 8

# widths = [4, 8]   # DEFAULT (lite + full) -- this is param_train.py's own default, so
                     # omitting this line does the same thing. Add a middle tier (e.g.
                     # [4, 5, 8]) only if you actually need a w5 intermediate.

epochs     = 0       # open-ended: trains with SGDR warm restarts until you `touch
                      # <ckpt>/STOP`, exporting the best model continuously. Use this
                      # first run to find the training budget, then set epochs to that
                      # schedule's real length for the production run.
batch-size = 64
lr         = 3e-4
crop-len   = 48000    # must EXCEED the receptive field (2483 samples / 52 ms @ 48 kHz
                        # for the standard A2 stack) -- 48000 (1 s) is comfortable.

# `repeats` (how many random crops-per-combination each epoch draws) is DERIVED from
# target-steps, not set directly -- see run_pipeline.py's own comment on why `repeats`
# is the free variable, not `epochs`. WITHOUT this set, repeats stays at param_train.py's
# CLI default (1): for a small grid (a few dozen-to-hundred combinations) that is only
# 1-2 gradient steps per epoch, so an "open-ended" run can rack up hundreds of epochs and
# thousands of SGDR cycles while barely training at all -- exactly what happened to a
# high-gain rectifier-style amp's config (72 combos, repeats defaulted to 1):
# 1200 epochs, 30 minutes, self-stopped on a false plateau, best ESR never below 0.5
# (2026-08-30). 25000 is every OTHER device in this fleet's own starting point, open-ended
# run included -- not a value chosen after the fact, so start with it here too, then adjust
# once you've watched the best-val-ESR-per-cycle curve (see docs/new-circuit-walkthrough.md).
target-steps = 25000

# MEASURED, not tuned by ear -- see grid_adequacy.py --suggest (README: Scripts).
[knobs]
Knob1 = [0.0, 0.5, 1.0]
Knob2 = [0.0, 0.5, 1.0]

# Auto-guessed by scaffold_config.py from each knob's NAME (same classify() heuristic
# preflight.py uses for its own direction/EQ-swamp checks) -- review any entry
# flagged UNCONFIRMED below; a misclassified knob silently gets the wrong knob-sensitivity
# metric here AND skips preflight's role-aware EQ-check safeguard. Values: hi/lo/mid (an
# EQ/tone-shaping knob -- checked by per-band spectral spread here, held LOW during another
# knob's EQ check in preflight.py), drive (a gain/distortion knob -- the one preflight.py
# holds low while checking an EQ knob), rms (a volume/level knob). Omit a knob to leave it
# unclassified (defaults to a plain RMS-spread check here; no special preflight treatment).
[knob-kind]
Knob1 = "drive"
Knob2 = "hi"

# Any control NOT listed in [knobs] is left at its schx default. To pin one explicitly --
# which makes this config a VARIANT of the device, not "the device"; state that if you do:
# [fixed]
# SomeControl = 1.0
