# Per-circuit ngspice convergence/damping defaults, keyed by a substring of the
# .schx filename. Applied automatically by batch_harness.py when the matching
# CLI flag is unset, so a circuit's known-good convergence config isn't
# re-typed each run (CLI flags always win). Analogous to how the 5150
# ot-damp/nfb-comp are hand-set today, but auto-derived per circuit.
#
# Keys map 1:1 to batch_harness.py / run_pipeline.py CLI flags: method, conv,
# ot_damp, ot_snub, nfb_comp, koren. Add a new [circuit] table here rather
# than editing batch_harness.py's source when a new circuit needs tuning.

["MT-2"]
conv = "diode_cjo=100p"   # soften the high-gain hard-clip edges

["Boss DS-1"]
method = "gear"
conv = "diode_cjo=100p,bjt_cje=40p,bjt_cjc=20p,tmax=20.8333u"
input_upsample = 4
# trap aborts at the antiparallel-diode clip node (dm1-instance dd5, "timestep
# too small"). gear alone is stable through ~23dB of op-amp gain (Dist<=0.6);
# the cjo bump (same fix as MT-2) is needed to also cover Dist=0.9-1.0 (near
# the documented 26.5dB max). bjt_cje/bjt_cjc/tmax are headroom for other
# marginal moments at high gain; kept for margin even though they were not
# the deciding fix (see below).
#
# STATUS (2026-07-12): RESOLVED. 121/121 permutations converge, zero
# failures, full Dist x Tone grid, ~9.75 min generation time.
#
# The real story: chasing failures with device-capacitance/tmax/solver-method
# tweaks (Dist=0.6/Tone=0.0+0.2, then 0.4/0.6, then 0.5/0.6, then 1.0/0.8 --
# each appearing only after the previous one was patched) was whack-a-mole
# against the wrong root cause, and input_upsample alone made it WORSE in one
# way while fixing it in another (see below) -- neither is a device/solver
# tuning problem. The actual root cause was the INPUT FILE: the sweep had an
# abrupt volume-jump splice around t=11-12s (adjacent 48kHz samples jumping
# ~0.6 in one sample at that exact point -- a real discontinuity, not just
# "high frequency content"). That splice, not sweep content in general, is
# what a real guitar signal never does and what was stressing the solver.
# Switching the input to a version with that splice removed
# (sweep45s.wav -- kept in a separate, private, non-redistributable repo
# alongside sweep60_composite.wav; NOT in parametric-nam) is what actually
# achieved 121/121.
#
# input_upsample is real and worth keeping, but it's a genuinely double-edged
# fix, not a strict improvement -- learn this before reaching for it on a
# future circuit. ngspice's filesource has no explicit interpolation mode, so
# it linearly interpolates 48kHz (t, v) pairs at whatever internal step it
# needs; linear interpolation of near-Nyquist content is a crude, inaccurate
# reconstruction, which ACCIDENTALLY low-pass-filters/attenuates that content
# before the solver ever sees it. Proper bandlimited upsampling removes that
# accidental damping and feeds the solver the TRUE, full-amplitude high
# frequency content -- which fixed several knob settings that were sensitive
# to the linear-interpolation "kink" artifact, but broke OTHERS (verified,
# isolated A/B: Dist=0.2/Tone=0.0 converged cleanly on the ORIGINAL sweep at
# native 48kHz, then failed at t=11.85s with input_upsample=4 and nothing
# else changed) that are sensitive to genuine high-frequency energy the crude
# interpolation had been masking. It only became a net win once combined with
# fixing the actual splice in the input file; on the original (spliced) sweep
# it just traded one set of failures for a different set, never reaching
# 121/121 on its own.
